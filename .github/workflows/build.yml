name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  release:
    name: release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (win-x64)
        run: >
          dotnet publish src/SmtcReader -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:DebugType=none -o artifacts/win-x64

      - name: Publish (win-arm64)
        run: >
          dotnet publish src/SmtcReader -c Release -r win-arm64 --self-contained true
          -p:PublishSingleFile=true -p:DebugType=none -o artifacts/win-arm64

      - name: Rename artifacts
        shell: pwsh
        run: |
          Move-Item artifacts/win-x64/smtc-reader.exe  artifacts/smtc-reader-${{ github.ref_name }}-win-x64.exe
          Move-Item artifacts/win-arm64/smtc-reader.exe artifacts/smtc-reader-${{ github.ref_name }}-win-arm64.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/smtc-reader-${{ github.ref_name }}-win-x64.exe
            artifacts/smtc-reader-${{ github.ref_name }}-win-arm64.exe
